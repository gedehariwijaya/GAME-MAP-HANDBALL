<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handball – Play Smart, Play Fair!</title>
<style>
:root{--card:#fff;--tx:#1f2a2e;--mut:#5d6b70;--pri:#0f766e;--pri2:#e0f2ef;--ok:#15803d;--bad:#b91c1c;--bg2:#f1f5f4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1a262a;--tx:#e7eef0;--mut:#9fb0b5;--pri:#2dd4bf;--pri2:#173a38;--ok:#4ade80;--bad:#f87171;--bg2:#10181b}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#05080a;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.stage{position:relative;width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;container-type:size;overflow:hidden;background:#0b1a24}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hud{position:absolute;left:44%;top:2%;display:flex;gap:.8cqw;z-index:4}
.chip{background:rgba(10,30,50,.85);color:#fff;border-radius:99px;padding:.5cqw 1.3cqw;font:inherit;font-weight:700;font-size:max(11px,1.4cqw);border:1px solid rgba(255,255,255,.35);cursor:pointer}
.stg{position:absolute;width:11cqw;height:19cqh;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer;border-radius:38%;padding:0}
.stg:focus-visible{outline:3px solid #fff}
.stg.cur{animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,255,255,.85)}100%{box-shadow:0 0 0 2cqw rgba(255,255,255,0)}}
.stg:hover:not(.lock){filter:brightness(1.15)}
.stg.lock{cursor:not-allowed;background:rgba(5,15,25,.55);font-size:3cqw}
.stg.lock::after{content:"🔒"}
.stg .st{position:absolute;left:50%;top:-4%;transform:translateX(-50%);font-size:max(10px,1.4cqw);white-space:nowrap;text-shadow:0 1px 3px #000}
.av{position:absolute;font-size:4.4cqw;line-height:1;transform:translate(-50%,-50%);transition:left 1.6s ease-in-out,top 1.6s ease-in-out;pointer-events:none;filter:drop-shadow(0 .3cqw .3cqw rgba(0,0,0,.55));z-index:2}
.av.walk{animation:hop .26s infinite}
@keyframes hop{50%{transform:translate(-50%,-66%)}}
.ov{position:absolute;inset:0;background:rgba(5,15,25,.62);display:flex;align-items:center;justify-content:center;z-index:5}
.ov.hidden{display:none}
.card{background:var(--card);color:var(--tx);width:82%;max-height:92%;overflow:auto;border-radius:1.4cqw;padding:1.8cqw 2.4cqw;font-size:max(12px,1.5cqw);line-height:1.45;box-shadow:0 1cqw 4cqw rgba(0,0,0,.5)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mut);font-size:.9em}
.x{background:transparent;border:0;color:var(--mut);font:inherit;cursor:pointer}
.vb{display:flex;align-items:center;gap:.8em;margin:.4em 0;font-weight:600;font-size:.9em}
.tr{flex:1;height:1em;background:var(--bg2);border-radius:9px;overflow:hidden;border:1px solid var(--pri2)}
.fl{height:100%;transition:width .4s,background .4s}
.q{font-weight:700;font-size:1.1em;margin:.4em 0 .5em}
.opt{display:block;width:100%;text-align:left;background:var(--bg2);color:var(--tx);border:2px solid transparent;border-radius:.8cqw;padding:.5em .9em;margin:.35em 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--pri2)}.opt.bad{border-color:var(--bad)}
.exp{margin-top:.5em;padding:.5em .9em;border-radius:.8cqw;background:var(--pri2)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:.8cqw;padding:.5em 1.4em;font:inherit;font-weight:700;cursor:pointer;margin-top:.6em}
.btn.alt{background:transparent;color:var(--pri);border:2px solid var(--pri);margin-left:.5em}
@media(prefers-color-scheme:dark){.btn{color:#062b27}}
h2{margin:.1em 0 .3em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2em}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.tri{position:relative}.nb{position:absolute;right:.4em;top:.3em;background:var(--pri);color:#fff;border-radius:99px;min-width:1.7em;text-align:center}
.sl{background:var(--pri2);border-radius:.8cqw;padding:.4em .8em;margin:.35em 0}
.big{text-align:center;font-weight:700;font-size:1.2em;padding:.9em}
.inp{width:100%;padding:.5em;font:inherit;border-radius:.6cqw;border:2px solid var(--pri2);background:var(--bg2);color:var(--tx)}
.avs{display:flex;gap:.6em}.av-b{font-size:2.4em;background:var(--bg2);border:3px solid transparent;border-radius:12px;cursor:pointer}.av-b.sel{border-color:var(--pri)}
.bds{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}.bd{text-align:center;background:var(--pri2);border-radius:12px;padding:.6em}.bd div{font-size:2.2em}.bd.off{opacity:.45}
.note{font-size:.8em;color:var(--mut)}
.rot{display:none;color:#cbd5d9;font-size:13px;padding:8px;text-align:center}
@media(orientation:portrait) and (max-width:700px){.rot{display:block}}
.inf{position:absolute;width:10cqw;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer;padding:0;text-align:center;z-index:3}
.inf:hover{filter:brightness(1.12)}.inf:focus-visible{outline:3px solid #fff;border-radius:1cqw}
.inf .ic{width:6.4cqw;height:6.4cqw;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3.4cqw;border:.5cqw solid #fff;box-shadow:0 .4cqw 1cqw rgba(0,0,0,.4)}
.inf .rb{margin-top:-.8cqw;display:inline-block;position:relative;padding:.2cqw 1.4cqw;color:#fff;font-weight:800;font-size:max(10px,1.5cqw);border-radius:.8cqw;border:.2cqw solid #fff;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.4)}
.inf.new .ic{animation:p 1.4s infinite}
.inf .ck{position:absolute;top:0;right:1.2cqw;background:#15803d;color:#fff;border-radius:50%;width:2cqw;height:2cqw;font-size:1.4cqw;line-height:2cqw}
.tabs{display:flex;flex-wrap:wrap;gap:.4em;margin:.5em 0}
.tab{background:var(--bg2);color:var(--tx);border:2px solid transparent;border-radius:99px;padding:.2em .9em;font:inherit;cursor:pointer}
.tab.on{background:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){.tab.on{color:#062b27}}
.card ul,.card ol{margin:.3em 0;padding-left:1.4em}.card li{margin:.25em 0}
</style></head><body>

const RAW=[
{n:"Mengenal Permainan Handball",e:"🤾",q:[
["Setiap tim handball menurunkan 7 pemain di lapangan. Pemain yang boleh menahan bola dengan seluruh anggota tubuh, termasuk kaki, saat berada di dalam daerah gawang adalah…",["Pivot","Pemain sayap","Pemain belakang tengah","Kiper"],3,"Tujuh pemain terdiri atas 6 pemain lapangan dan 1 kiper. Hanya kiper yang boleh berada di daerah gawang dan menahan bola dengan seluruh tubuh di sana."],
["Panitia sekolah akan membuat lapangan handball standar. Ukuran lapangan dan gawang yang benar adalah…",["Lapangan 28 m × 15 m, gawang 3 m × 2 m","Lapangan 40 m × 20 m, gawang 5 m × 2,4 m","Lapangan 40 m × 20 m, gawang lebar 3 m dan tinggi 2 m","Lapangan 60 m × 30 m, gawang 7,32 m × 2,44 m"],2,"Lapangan handball resmi berukuran 40 m × 20 m dengan gawang 3 m × 2 m. Pilihan lain mencampur ukuran dari cabang olahraga lain."],
["Tembakan membentur tiang gawang lalu memantul kembali ke lapangan tanpa seluruh bola melewati garis gawang. Keputusan yang tepat?",["Tidak gol dan permainan dilanjutkan, karena gol sah bila seluruh bola melewati garis gawang","Gol, karena bola sudah menyentuh gawang","Gol, jika kiper ikut menyentuh bola","Ditentukan oleh suara penonton"],0,"Gol sah hanya jika seluruh bola melewati garis gawang di antara kedua tiang dan di bawah mistar."],
["Pemain yang bermain di dekat garis daerah gawang lawan, bertugas menerima umpan, memasang blok, dan menembak dari jarak dekat disebut…",["Pemain sayap","Pivot (line player)","Pemain belakang tengah","Kiper"],1,"Pivot bermain di antara pemain bertahan lawan dekat garis 6 m, membuka ruang bagi rekan, dan menyelesaikan serangan dari jarak dekat."],
["Seorang guru ingin memilih permainan yang melatih kecepatan, kelincahan, daya ledak, dan pengambilan keputusan cepat sekaligus kerja sama tim. Alasan paling tepat memilih handball adalah…",["Pemain hanya berdiri di posisi tetap sehingga mudah dikuasai","Pertandingan tidak memiliki aturan yang membatasi sentuhan bola","Pemain terus berpindah antara menyerang dan bertahan dengan berlari, melompat, melempar, dan mengambil keputusan bersama rekan","Hanya pemain bertubuh tinggi yang dapat berperan penting"],2,"Transisi cepat antara menyerang dan bertahan membuat handball melatih kebugaran sekaligus kecerdasan bermain dan kerja sama."]]},
{n:"Teknik Dasar Handball",e:"🎯",q:[
["Bola melaju cepat setinggi dada ke arah pemain. Teknik menangkap yang paling tepat adalah…",["Jari terbuka dan rileks, tangan menyambut bola, lalu siku menekuk menarik bola ke dada untuk meredam laju","Tangan kaku dan lurus agar bola memantul keras","Menangkap dengan telapak tangan tertutup rapat sambil memejamkan mata","Menunggu bola jatuh ke lantai"],0,"Jari terbuka dan siku yang meredam laju bola mengurangi bola lepas serta risiko jari cedera."],
["Pemain menerima bola lalu melangkah empat kali tanpa menggiring bola sebelum mengoper. Keputusan wasit yang tepat?",["Sah, karena handball tidak membatasi langkah","Lemparan sudut untuk tim penyerang","Pelanggaran dribel ganda dan kartu merah","Pelanggaran langkah (lebih dari 3 langkah), bola diberikan kepada lawan"],3,"Pemain hanya boleh maksimal 3 langkah sambil memegang bola, lalu harus mengoper, menembak, atau menggiring."],
["Pemain menggiring bola, menangkapnya dengan dua tangan, lalu menggiring lagi tanpa disentuh lawan. Pelanggaran yang terjadi adalah…",["Pelanggaran 3 detik","Dribel ganda (double dribble)","Pelanggaran daerah gawang","Tidak ada pelanggaran"],1,"Setelah menggiring lalu menangkap bola, pemain harus mengoper atau menembak. Menggiring lagi tergolong dribel ganda."],
["Dari rekaman latihan, tembakan pemain belakang dari jarak 9 m kurang bertenaga walaupun lengannya kuat. Tubuhnya tegak, kaki tidak bertumpu, dan pinggul tidak berputar. Perbaikan teknik yang paling tepat?",["Menambah beban latihan lengan saja","Menembak sambil berdiri diam agar lebih akurat","Melangkah dengan kaki berlawanan arah lengan lempar, memutar pinggul dan bahu, lalu mengayun lengan secara berurutan","Menggenggam bola sekuat mungkin dengan seluruh telapak tangan"],2,"Tenaga tembakan dibangun dari rantai gerak: kaki, pinggul, bahu, lengan, lalu jari."],
["Pemain A akan mengoper ke rekan B yang sedang berlari menuju gawang. Agar B dapat menangkap tanpa kehilangan kecepatan, A sebaiknya mengoper ke…",["Ruang di depan arah lari B dengan kecepatan yang sesuai","Titik tempat B berada saat bola dilepas","Belakang B agar mudah dikejar","Tinggi di atas kepala B"],0,"Operan ke ruang di depan rekan yang bergerak (lead pass) menjaga tempo serangan."]]},
{n:"Taktik dan Strategi Permainan",e:"🧠",q:[
["Lawan memiliki dua pemain belakang dengan tembakan jarak jauh yang akurat, sedangkan pivotnya lemah. Formasi bertahan yang paling tepat adalah…",["6-0, seluruh pemain rapat di garis 6 m","Bertahan di dekat gawang agar kiper terbantu","5-1 atau 3-2-1, satu pemain maju menekan penembak","Semua pemain berdiri di tengah lapangan"],2,"Formasi menekan mempersempit ruang dan waktu tembak jarak jauh, sedangkan pivot lawan yang lemah mengurangi risiko di garis 6 m."],
["Kiper menangkap tembakan lawan, dan dua rekan sudah berlari melewati tengah lapangan sementara pertahanan lawan belum tertata. Keputusan terbaik kiper?",["Segera mengumpan cepat ke rekan yang bebas untuk serangan balik","Berjalan pelan ke garis 6 m menunggu tim kembali","Menembak sendiri ke gawang lawan","Menahan bola sampai seluruh tim berada di setengah lapangan"],0,"Serangan balik cepat (fast break) memanfaatkan pertahanan lawan yang belum siap."],
["Tim menyerang dengan operan berputar tanpa peluang menembak, lalu wasit mengangkat tangan sebagai tanda peringatan bermain pasif. Strategi yang paling tepat adalah…",["Terus memutar bola karena aturan tidak membatasi operan","Memperlambat permainan supaya lawan lelah","Menendang bola keluar lapangan","Mempercepat serangan dan menembak dalam beberapa operan (umumnya sekitar enam)"],3,"Setelah peringatan bermain pasif, tim harus segera menyelesaikan serangan. Jika tidak, bola diberikan kepada lawan."],
["Lawan menjaga pivot kita dengan sangat ketat sehingga pivot sulit menerima bola. Cara membuka celah serang yang paling logis adalah…",["Menembak dari jarak jauh terus-menerus","Pemain belakang melakukan gerak silang (crossing) dan tipuan untuk menarik penjaga sehingga muncul celah","Seluruh pemain berkumpul di satu sisi tanpa bergerak","Pivot berpindah menjadi kiper"],1,"Gerak silang dan tipuan menggeser posisi bek lawan sehingga tercipta ruang bagi pivot atau penembak."],
["Hasil pengamatan: 60% gol lawan lahir dari sisi sayap kanan pertahanan kita. Penyesuaian taktik yang paling logis adalah…",["Mengganti seluruh pemain tanpa analisis","Hanya memperkuat sisi kiri pertahanan","Menutup jalur umpan ke sayap kanan lawan dan memberi bantuan bek di sisi itu","Berhenti bertahan dan hanya menyerang"],2,"Keputusan taktik didasarkan pada data: perkuat area yang paling sering ditembus."]]},
{n:"Kerja Sama Tim",e:"🤝",q:[
